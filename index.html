<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang tải...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #video-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
  }

  #scare-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Màn hình chờ trong lúc trình duyệt cần 1 tương tác để bật âm thanh */
  #tap-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    cursor: pointer;
  }

  #tap-overlay p {
    color: #444;
    font-family: sans-serif;
    font-size: 14px;
    opacity: 0.6;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="video-container">
  <video id="scare-video" src="uploads/ghost.mp4" playsinline></video>
</div>

<!-- Lớp phủ để "câu" một cú chạm/click đầu tiên, giúp trình duyệt mobile cho phép phát âm thanh -->
<div id="tap-overlay">
  <p>Đang tải video...</p>
</div>

<script>
  const video = document.getElementById('scare-video');
  const overlay = document.getElementById('tap-overlay');

  function playScare() {
    video.muted = false;
    video.volume = 1.0;
    video.currentTime = 0;
    const playPromise = video.play();

    if (playPromise !== undefined) {
      playPromise.catch(() => {
        // Nếu trình duyệt vẫn chặn autoplay có tiếng, thử phát muted trước rồi bật tiếng ngay sau
        video.muted = true;
        video.play();
        setTimeout(() => { video.muted = false; }, 50);
      });
    }
    overlay.classList.add('hidden');
  }

  // Thử tự phát ngay khi trang load (có thể bị chặn nếu chưa có tương tác)
  window.addEventListener('load', () => {
    playScare();
  });

  // Nếu bị chặn autoplay có âm thanh, cú chạm/click đầu tiên bất kỳ ở đâu trên trang sẽ kích hoạt phát full tiếng
  document.addEventListener('click', playScare, { once: true });
  document.addEventListener('touchstart', playScare, { once: true });

  // Khi video load xong metadata, ẩn overlay nếu đã play được
  video.addEventListener('playing', () => {
    overlay.classList.add('hidden');
  });
</script>

</body>
</html>
