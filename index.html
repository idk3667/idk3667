<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #stage {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
  }

  /* Ảnh bìa giả lập video đang dừng */
  #cover {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-image: url('uploads/background.jpg');
    background-size: contain;      /* giữ đúng tỉ lệ ảnh, không phóng to/crop */
    background-repeat: no-repeat;
    background-position: center;
    background-color: #000;
    cursor: pointer;
    z-index: 10;
  }

  /* Nút Play kiểu YouTube */
  #play-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  #cover:hover #play-btn {
    background: rgba(255, 0, 0, 0.8);
  }

  #play-btn svg {
    width: 32px;
    height: 32px;
    fill: #fff;
    margin-left: 5px; /* căn giữa hình tam giác play */
  }

  /* Thanh tiến trình giả để giống video đang dừng */
  #fake-progress {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
  }

  #fake-progress-bar {
    width: 0%;
    height: 100%;
    background: #ff0000;
  }

  #video-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: none;
    z-index: 5;
  }

  #scare-video {
    width: 100%;
    height: 100%;
    object-fit: contain;  /* giữ tỉ lệ gốc, không bị phóng to méo hình */
    background: #000;
  }
</style>
</head>
<body>

<div id="stage">

  <div id="video-container">
    <video id="scare-video" src="uploads/ghost.mp4" playsinline></video>
  </div>

  <div id="cover">
    <div id="play-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div id="fake-progress">
      <div id="fake-progress-bar"></div>
    </div>
  </div>

</div>

<script>
  const cover = document.getElementById('cover');
  const videoContainer = document.getElementById('video-container');
  const video = document.getElementById('scare-video');

  cover.addEventListener('click', () => {
    cover.style.display = 'none';
    videoContainer.style.display = 'block';

    video.muted = false;
    video.volume = 1.0;
    video.currentTime = 0;
    video.play().catch(() => {
      // fallback nếu vẫn bị chặn tiếng, gần như không xảy ra vì đã có click
      video.muted = true;
      video.play();
      setTimeout(() => { video.muted = false; }, 50);
    });
  });
</script>

</body>
</html>
